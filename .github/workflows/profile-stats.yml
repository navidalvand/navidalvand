name: Refresh public profile statistics

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-public-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public repository statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_stats.py
      - name: Commit changed statistics
        run: |
          git add assets/github-stats.json assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile statistics"
          git push
