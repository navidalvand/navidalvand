name: Refresh public profile statistics
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-public-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public repository and commit statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/refresh_stats.py
          python3 scripts/refresh_activity.py
      - name: Commit changed statistics
        run: |
          git add assets/github-stats.json assets/github-stats.svg assets/activity.json assets/activity-heatmap.svg assets/activity-3d.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile statistics"
          git push
