<svg xmlns="http://www.w3.org/2000/svg" width="960" height="264" viewBox="0 0 960 264" role="img" aria-labelledby="title desc">
  <title id="title">Navid Alvand — Full-stack engineer and founder</title>
  <desc id="desc">Minimal dark graphite profile banner with teal accents and a geometric engineering-inspired monogram.</desc>
  <defs>
